{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | LMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #4e73df, #1cc88a);
            height: 100vh;
            display: flex;
            align-items: center;
        }

        .card-hover {
            transition: 0.3s;
        }

        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8 text-center">

            <h2 class="text-white mb-5 fw-bold">Choose Your Role</h2>

            <div class="row g-4">

                <!-- Faculty Option -->
                <div class="col-md-6">
                    <div class="card card-hover shadow-lg h-100">
                        <div class="card-body text-center p-5">
                            <h3 class="text-primary mb-3">👨‍🏫 Faculty</h3>
                            <p>Create courses, manage students and track progress.</p>
                            <a href="{% url 'faculty_register_view' %}" class="btn btn-primary mt-3 w-100">
                                Register as Faculty
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Student Option -->
                <div class="col-md-6">
                    <div class="card card-hover shadow-lg h-100">
                        <div class="card-body text-center p-5">
                            <h3 class="text-success mb-3">🎓 Student</h3>
                            <p>Enroll in courses, learn new skills and track achievements.</p>
                            <a href="{% url 'student_register_view' %}" class="btn btn-success mt-3 w-100">
                                Register as Student
                            </a>
                        </div>
                    </div>
                </div>

            </div>

            <div class="mt-4">
                <a href="{% url 'login_view' %}" class="text-white text-decoration-none">
                    Already have an account? Login
                </a>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
