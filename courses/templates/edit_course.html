{% extends 'base.html' %}
{% block title %}Edit Course | LMS{% endblock %}

{% block content %}
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>✏ Edit Course</h4>
        <a href="{% url 'course_list_view' %}" class="btn btn-secondary">← Back</a>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Course Name</label>
            <input type="text" name="course_name" class="form-control"
                   value="{{ course.course_name }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Duration</label>
            <input type="text" name="course_duration" class="form-control"
                   value="{{ course.course_duration }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control">{{ course.description }}</textarea>
        </div>

        <button type="submit" class="btn btn-warning">Update Course</button>
    </form>

</div>
{% endblock %}
