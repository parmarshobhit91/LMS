{% extends 'base.html' %}
{% block title %}Link Subject | LMS{% endblock %}

{% block content %}
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Link Subject </h4>
        <a href="{% url 'course_detail_view' course.id%}" class="btn btn-secondary">← Back</a>
    </div>

    <form method="POST">
        {% csrf_token %}
        
        {% for subject in subjects %}
            <div>
                <input type="checkbox"
                name="subjects"
                value="{{subject.id}}"
                {% if subject in course.subjects.all %}checked{% endif %}>
                {{ subject.subject_name }}
            </div>
        {% endfor %}
 
        <button type="submit" class="btn btn-primary">Link Subject</button>
    </form>

</div>
{% endblock %}
